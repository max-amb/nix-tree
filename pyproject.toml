[project]
name = "nix-tree"
version = "0.1.0"
description = "A tool for viewing and editing your nix configuration as a tree"
authors = [ { name = "Max Ambaum", email = "max_a@e.email" } ]
license = "GPL-3.0-only"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pytest>=9.1.1",
    "textual>=8.2.7",
]

[project.scripts]
nix-tree = "nix_tree:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"
